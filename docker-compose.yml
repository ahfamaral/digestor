services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: digestor
      POSTGRES_PASSWORD: digestor
      POSTGRES_DB: digestor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digestor -d digestor"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:1.5.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/data
    # Chroma 1.5.0 keeps ~12 file handles per deleted collection; at the default 1024 it fails with
    # "unable to open database file" after a few test runs (or many retention deletions).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # The image has no curl/wget: bash's /dev/tcp asks the heartbeat endpoint for a 200.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf "GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && timeout 3 head -n1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    restart: unless-stopped
    working_dir: /app
    command: pnpm --filter @digestor/worker dev
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://digestor:digestor@postgres:5432/digestor
      CHROMA_URL: http://chroma:8000
      HF_HOME: /data/models
      TEST_DATABASE_URL: postgres://digestor:digestor@postgres:5432/digestor_test
      DATA_DIR: /data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_REASONING: ${OPENROUTER_MODEL_REASONING:-}
      OPENROUTER_MODEL_FAST: ${OPENROUTER_MODEL_FAST:-}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      VIDEO_RETENTION_DAYS: ${VIDEO_RETENTION_DAYS:-14}
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-5}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      MONITOR_VIDEO_ENABLED: ${MONITOR_VIDEO_ENABLED:-}
      BUNDESTAG_DIP_API_KEY: ${BUNDESTAG_DIP_API_KEY:-}
      API_DATA_GOV_KEY: ${API_DATA_GOV_KEY:-}
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
      - worker_core_node_modules:/app/packages/core/node_modules
      - worker_app_node_modules:/app/apps/worker/node_modules
      # keeps the container's install of apps/web deps off the host's apps/web/node_modules (bind mount)
      - worker_web_node_modules:/app/apps/web/node_modules
      - ./data:/data
      - ./secrets:/secrets:ro
      - pnpm-store:/pnpm-store

volumes:
  pgdata:
  chromadata:
  worker_node_modules:
  worker_core_node_modules:
  worker_app_node_modules:
  worker_web_node_modules:
  pnpm-store:
